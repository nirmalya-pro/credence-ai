services:
  - type: web
    name: credence-ai-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
